# Stack d'observabilité locale (DEV UNIQUEMENT) : Prometheus + Grafana.
#
# Indépendante du docker-compose.yml principal : l'API et MySQL restent
# lançables seuls, cette stack est optionnelle. Prérequis : l'API tourne sur
# l'hôte avec OTEL_METRICS_ENABLED=True (endpoint /metrics, port 8000).
#
#   docker compose -f docker-compose.observability.yml up -d
#
# Grafana : http://localhost:3000 (datasource et dashboard pré-provisionnés,
# accès anonyme admin — réservé au poste de dev). Prometheus : http://localhost:9090.
services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: factur_ia_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Permet au conteneur de joindre l'API qui tourne sur l'hôte (requis sur
    # Linux ; natif sur Docker Desktop macOS/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.4.6
    container_name: factur_ia_grafana
    ports:
      - "3000:3000"
    environment:
      # Accès sans login, en admin : uniquement acceptable pour une stack
      # locale de dev jetable.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
