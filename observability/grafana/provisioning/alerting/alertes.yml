# Alertes provisionnées au démarrage de Grafana (alerting unifié, sans
# Alertmanager : une brique de moins, l'état Normal/Pending/Firing est
# visible dans l'interface, et les règles sont versionnées ici).
#
# Chaque règle suit le même schéma en deux nœuds :
#   A = requête Prometheus instantanée (la valeur mesurée)
#   B = seuil sur A (la condition d'alerte)
# La règle passe en Pending quand la condition est vraie, puis en Firing si
# elle le reste pendant la durée `for`.
#
# Seuils (raisonnement détaillé dans le README, section « Alertes et seuils ») :
#   - API : > 5 % de réponses 5xx pendant 2 min ;
#   - API : latence p95 entrante > 2 s pendant 2 min ;
#   - dépendances externes : > 20 % d'appels sortants en échec (5xx +
#     échecs de connexion via external_api_unavailable_total) pendant 2 min ;
#   - pool DB : > 12 connexions utilisées (80 % de la capacité 5+10) 2 min ;
#   - API hors ligne : cible Prometheus down pendant 2 min.
apiVersion: 1

groups:
  - orgId: 1
    name: factur-ia-api
    folder: Factur-IA API
    interval: 1m
    rules:
      - uid: api-taux-5xx
        title: "API — taux de 5xx élevé (> 5 %)"
        condition: B
        for: 2m
        # Pas de trafic ou aucune 5xx => pas de donnée : état Normal.
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: >-
            Plus de 5 % des requêtes servies par l'API répondent en erreur
            serveur (5xx) sur les 5 dernières minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                /
                sum(rate(http_server_request_duration_seconds_count[5m]))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: api-latence-p95
        title: "API — latence p95 dégradée (> 2 s)"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: >-
            La latence p95 des requêtes entrantes de l'API dépasse 2 secondes
            sur les 5 dernières minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                histogram_quantile(0.95, sum by (le)
                (rate(http_server_request_duration_seconds_bucket[5m])))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }

      - uid: dependances-erreurs
        title: "Dépendances externes — appels en erreur (> 20 %)"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: >-
            Plus de 20 % des appels sortants vers les services externes
            (SIRENE, API IA, Chorus Pro) échouent (réponses 5xx ou échecs de
            connexion) sur les 5 dernières minutes. Le compteur
            external_api_unavailable_total couvre le cas « service éteint »,
            invisible pour l'instrumentation httpx standard ; son label
            `service` indique la dépendance en cause dans le dashboard.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                ((sum(rate(http_client_request_duration_seconds_count{error_type=~"5.."}[5m])) or vector(0))
                 + (sum(rate(external_api_unavailable_total[5m])) or vector(0)))
                /
                ((sum(rate(http_client_request_duration_seconds_count[5m])) or vector(0))
                 + (sum(rate(external_api_unavailable_total[5m])) or vector(0)))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }

      - uid: pool-db-sature
        title: "Pool DB — saturation (> 80 % des connexions)"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: >-
            Plus de 12 connexions MySQL sont utilisées simultanément, soit
            plus de 80 % de la capacité du pool SQLAlchemy (pool_size 5 +
            max_overflow 10 = 15, valeurs par défaut non surchargées dans
            core/database.py). Au-delà, les requêtes attendent une connexion.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # L'exporteur Prometheus suffixe le nom OTel avec l'unité :
              # db.client.connections.usage → ..._usage_connections.
              expr: >-
                sum(db_client_connections_usage_connections{state="used"})
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [12] }

      - uid: api-down
        title: "API hors ligne (cible Prometheus down)"
        condition: B
        for: 2m
        # Ici l'absence de donnée est elle-même suspecte (la série `up`
        # existe tant que la cible est configurée) : on alerte aussi.
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: >-
            Prometheus ne parvient plus à scruter /metrics de l'API
            (application arrêtée, ou lancée sans OTEL_METRICS_ENABLED=True).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job="factur-ia-api"}
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
